<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UBC Room Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <span>UBC Room Finder</span>
  </header>

  <main>
    <form id="form" autocomplete="off">
      <label class="full">Date
        <input type="date" id="date" required>
      </label>
      <div class="row">
        <label>From
          <input type="time" id="from" step="900" required>
        </label>
        <label>To
          <input type="time" id="to" step="900" required>
        </label>
      </div>
      <div id="recent" class="recent"></div>
      <label class="full">Building
        <select id="building"><option>Henry Angus</option></select>
      </label>
      <button type="submit" id="go" class="primary">Find free rooms</button>
    </form>

    <div id="out" aria-live="polite"></div>
  </main>

  <footer>
    <a href="https://sws-van.as.it.ubc.ca/" target="_blank" rel="noopener">Open the UBC Online Timetable</a>
    <p>Reads the live timetable using your own CWL sign-in. Doesn't book rooms. Tentative holds may not show. Not affiliated with UBC.</p>
  </footer>

  <script src="sws.js"></script>
  <script src="popup.js"></script>
</body>
</html>
